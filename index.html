<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>я там был — карта</title>
  <meta name="description" content="Карта канала «я там был, мёд-пиво пил»: места, где уже была, и места, куда хочется.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232c6248'/%3E%3Ccircle cx='16' cy='14' r='5' fill='%23f6f1e6'/%3E%3Cpath d='M16 18.5 L16 26' stroke='%23f6f1e6' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.Default.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="handle" aria-hidden="true"></div>
      <header class="mast">
        <p class="eyebrow">канал · <a href="https://t.me/ya_tam_byl" target="_blank" rel="noopener">@ya_tam_byl</a></p>
        <h1>я там был</h1>
        <p class="lede">мёд-пиво пил</p>
        <p id="stats" class="stats"></p>
        <p id="verdict-stats" class="stats soft"></p>
      </header>

      <div class="tools">
        <div class="chips" id="bucket-chips" role="group" aria-label="Где я была"></div>
        <div class="chips" id="verdict-chips" role="group" aria-label="Отзыв"></div>
        <label class="search">
          <span class="sr">Поиск</span>
          <input id="q" type="search" placeholder="Место, город или слово из отзыва" autocomplete="off">
        </label>
        <label class="city-filter">
          <span class="sr">Город</span>
          <select id="city" aria-label="Город"></select>
        </label>
      </div>

      <div id="list"></div>

      <footer class="side-foot">
        <button id="share" class="quiet" type="button">Ссылка для друзей</button>
        <p class="fine">Места и картинки берутся из постов канала.</p>
      </footer>
    </aside>

    <div id="stage">
      <div id="map" role="application" aria-label="Карта мест"></div>
      <div id="legend">
        <span><i class="pin pin-like"></i>понравилось</span>
        <span><i class="pin pin-mixed"></i>смешанно</span>
        <span><i class="pin pin-dislike"></i>не зашло</span>
        <span><i class="pin pin-wish"></i>хочу</span>
      </div>
      <button id="fit" type="button">Все места</button>
    </div>
  </div>

  <p id="toast" class="toast" hidden role="status"></p>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/leaflet.markercluster.js"></script>
  <script src="places.js"></script>
  <script src="app.js"></script>
</body>
</html>
